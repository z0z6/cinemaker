<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; img-src 'self' file: data:; media-src 'self' file:; style-src 'self'; script-src 'self'" />
  <title>Kadr Studio</title>
  <script src="js/theme-boot.js"></script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">Kadr Studio</div>
    <div class="group">
      <button id="btn-new" title="Nowy projekt">Nowy</button>
      <button id="btn-open" title="Otwórz projekt (Ctrl+O)">Otwórz</button>
      <button id="btn-save" title="Zapisz projekt (Ctrl+S)">Zapisz</button>
    </div>
    <div class="group">
      <button id="btn-undo" title="Cofnij (Ctrl+Z)">Cofnij</button>
      <button id="btn-redo" title="Ponów (Ctrl+Y)">Ponów</button>
    </div>
    <div id="project-name" class="project-name"></div>
    <label class="theme-pick" for="theme">Motyw <select id="theme"></select></label>
    <button id="btn-export" class="primary" title="Eksportuj film, dźwięk, grafikę lub prezentację (Ctrl+E)">Eksportuj</button>
  </header>

  <main class="workspace">
    <aside class="panel library">
      <div class="panel-head">
        <h2>Pliki</h2>
        <div class="group">
          <button id="btn-add-text" title="Dodaj napis na torze Tekst (T)">Dodaj tekst</button>
          <button id="btn-import" class="accent" title="Importuj pliki">Importuj</button>
        </div>
      </div>
      <div id="lib" class="lib-list"></div>
      <div id="lib-empty" class="empty-state">
        <p><strong>Dodaj materiały</strong></p>
        <p>Kliknij „Importuj” albo przeciągnij tu wideo, muzykę lub zdjęcia.</p>
      </div>
    </aside>

    <section class="panel preview">
      <div id="stage-wrap" class="stage-wrap">
        <div id="stage" class="stage"></div>
      </div>
      <div class="transport">
        <button id="btn-start" title="Na początek (Home)">⏮</button>
        <button id="btn-play" class="play" title="Odtwarzaj / pauza (Spacja)">▶</button>
        <button id="btn-end" title="Na koniec (End)">⏭</button>
        <div class="time mono"><span id="time-now">0:00.0</span><span class="sep">/</span><span id="time-total">0:00.0</span></div>
      </div>
    </section>

    <aside class="panel inspector-panel">
      <div class="panel-head"><h2>Właściwości</h2></div>
      <div id="inspector" class="inspector"></div>
    </aside>
  </main>

  <section class="timeline">
    <div class="tl-toolbar">
      <div class="group">
        <button id="btn-split" title="Podziel w miejscu głowicy (S)">Podziel</button>
        <button id="btn-delete" title="Usuń zaznaczony klip (Delete)">Usuń</button>
        <button id="btn-ripple" title="Usuń i zamknij lukę (Shift+Delete)">Usuń z lukiem</button>
      </div>
      <div class="group zoom-group">
        <label for="zoom">Powiększenie</label>
        <input id="zoom" type="range" min="0" max="100" step="1" value="42" />
        <button id="btn-fit" title="Dopasuj oś czasu do projektu">Dopasuj</button>
      </div>
    </div>
    <div id="tl-scroll" class="tl-scroll">
      <div id="tl-content" class="tl-content">
        <div id="tl-ruler" class="tl-ruler">
          <div class="tl-corner"></div>
          <div id="tl-ruler-lane" class="tl-ruler-lane"></div>
        </div>
        <div id="tl-tracks" class="tl-tracks"></div>
        <div id="tl-playhead" class="tl-playhead"><span></span></div>
      </div>
    </div>
  </section>

  <dialog id="export-dlg" class="dlg" aria-labelledby="ex-title">
    <h2 id="ex-title">Eksport</h2>
    <div id="ex-form">
      <div id="ex-groups" class="seg" role="group" aria-label="Rodzaj pliku"></div>
      <div class="field"><label for="ex-format">Format</label><select id="ex-format"></select></div>
      <p id="ex-desc" class="hint"></p>
      <div class="field" data-opt="res"><label for="ex-res">Rozdzielczość</label><select id="ex-res"></select></div>
      <div class="field" data-opt="fps"><label for="ex-fps">Klatki na sekundę</label><select id="ex-fps"></select></div>
      <div class="field" data-opt="quality"><label for="ex-q">Jakość</label><select id="ex-q"></select></div>
      <div class="field" data-opt="slides"><label for="ex-slides">Slajdy</label>
        <select id="ex-slides">
          <option value="clips">Jeden na każde ujęcie</option>
          <option value="interval">Co określony czas</option>
        </select></div>
      <div class="field" data-opt="interval"><label for="ex-interval">Odstęp</label>
        <select id="ex-interval">
          <option value="1">co 1 s</option><option value="2">co 2 s</option><option value="5" selected>co 5 s</option>
          <option value="10">co 10 s</option><option value="15">co 15 s</option><option value="30">co 30 s</option><option value="60">co minutę</option>
        </select></div>
      <p id="ex-info" class="hint"></p>
    </div>
    <div id="ex-run" hidden>
      <progress id="ex-bar" max="1" value="0"></progress>
      <p id="ex-status" class="hint">Renderowanie…</p>
    </div>
    <p id="ex-error" class="error" hidden></p>
    <div class="dlg-actions">
      <button id="ex-close">Zamknij</button>
      <button id="ex-reveal" hidden>Pokaż w folderze</button>
      <button id="ex-cancel" hidden>Przerwij</button>
      <button id="ex-start" class="primary">Eksportuj…</button>
    </div>
  </dialog>

  <div id="toast" class="toast" role="status"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
