name: Build (Windows)

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # potrzebne tylko do publikacji release przy tagu v*

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalacja zależności (pobiera też FFmpeg i FFprobe)
        run: npm ci

      - name: Test silnika eksportu (prawdziwy FFmpeg)
        run: npm run test:graph

      - name: Budowanie instalatora i wersji portable
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'   # bez podpisywania kodu

      - uses: actions/upload-artifact@v4
        with:
          name: kadr-studio-windows
          path: dist/*.exe
          if-no-files-found: error

      - name: Publikacja release (tylko dla tagów v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          generate_release_notes: true
