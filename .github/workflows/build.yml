name: Build (Windows + Linux)

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # potrzebne tylko do publikacji release przy tagu v*

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist:win
            artifact: kadr-studio-windows
            files: dist/*.exe
          - os: ubuntu-22.04          # starsza glibc => AppImage działa też na starszych dystrybucjach
            script: dist:linux
            artifact: kadr-studio-linux
            files: dist/*.AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalacja zależności (pobiera też FFmpeg i FFprobe)
        run: npm ci

      - name: Test silnika eksportu (prawdziwy FFmpeg)
        run: npm run test:graph

      - name: Budowanie (${{ matrix.script }})
        run: npm run ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'   # bez podpisywania kodu

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error

      - name: Publikacja release (tylko dla tagów v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.files }}
          generate_release_notes: true
